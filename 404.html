<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrong note — Aditya Borkar</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#fffff2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0f1d" media="(prefers-color-scheme: dark)" />
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preload" href="/fonts/Zodiak-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Zodiak';
      src: url('/fonts/Zodiak-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Zodiak';
      src: url('/fonts/Zodiak-VariableItalic.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0b5aff;
      --bg: #fffff2;
      --rule: rgb(var(--blue-rgb) / 0.22);
    }

    html, body { min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--blue);
      font-family: 'Zodiak', Georgia, serif;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: -0.03em;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    html.custom-cursor, html.custom-cursor * { cursor: none !important; }
    html:not(.custom-cursor) #cursor { display: none; }

    a { color: inherit; text-decoration: none; }

    #cursor {
      position: fixed;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--blue);
      opacity: 0.7;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    #cursor.hovering { transform: translate(-50%, -50%) scale(2.2); opacity: 0.4; }

    /* ── NAV ───────────────────────────────────────────────── */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 44px 52px 0;
    }
    .nav a { font-size: 22px; letter-spacing: -0.3px; transition: opacity 0.15s; }
    .nav a:last-child { font-size: 18px; }
    .nav a:hover { opacity: 0.5; }

    /* ── HERO ──────────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 52px 72px;
    }

    .eyebrow { font-size: 14px; letter-spacing: 0.02em; margin-bottom: 8px; }

    .big {
      font-size: clamp(120px, 24vw, 300px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.04em;
      display: flex;
      align-items: center;
      gap: 0.02em;
      user-select: none;
    }

    /* The zero is a whole note. Click it for a chord. */
    .whole {
      font: inherit;
      flex-shrink: 0;
      width: 0.82em;
      height: 0.58em;
      margin: 0 0.04em;
      color: inherit;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      animation: bob 3.2s ease-in-out infinite;
      transform-origin: 50% 60%;
    }
    .whole svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .whole:active { transform: scale(0.94); }
    .whole.ring { animation: ring 0.5s ease, bob 3.2s ease-in-out 0.5s infinite; }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-0.04em) rotate(-3deg); }
    }
    @keyframes ring {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.12) rotate(-6deg); }
      100% { transform: scale(1); }
    }

    .headline {
      font-size: clamp(28px, 4.2vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-top: 28px;
      max-width: 18em;
    }
    .headline em { font-style: italic; }

    /* ── STAFF ─────────────────────────────────────────────── */
    .play-label {
      font-size: 15px;
      opacity: 0.72;
      margin-top: 40px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .staff {
      position: relative;
      height: 160px;
      cursor: crosshair;
      touch-action: manipulation;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .staff:focus-visible { box-shadow: 0 0 0 2px var(--blue); }
    .staff .line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: var(--blue);
      opacity: 0.45;
      pointer-events: none;
    }
    .staff .meter {
      position: absolute;
      left: 6px;
      top: 40px;
      height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 40px;
      line-height: 40px;
      font-weight: 600;
      pointer-events: none;
    }
    .staff .meter span { display: block; height: 40px; }

    .note {
      position: absolute;
      width: 22px;
      height: 16px;
      margin: -8px 0 0 -11px;
      pointer-events: none;
      animation: drift 2.8s cubic-bezier(.2,.6,.3,1) forwards;
    }
    .note .head {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--blue);
      transform: rotate(-22deg);
    }
    .note .stem {
      position: absolute;
      width: 2px;
      height: 54px;
      background: var(--blue);
    }
    .note.up .stem   { right: 1px; bottom: 7px; }
    .note.down .stem { left: 1px; top: 7px; }
    .note.pop .head { animation: pop 0.25s ease; }

    @keyframes drift {
      0%   { opacity: 1; transform: translateX(0); }
      70%  { opacity: 0.9; }
      100% { opacity: 0; transform: translateX(-140px); }
    }
    @keyframes pop {
      0%   { transform: rotate(-22deg) scale(0.4); }
      70%  { transform: rotate(-22deg) scale(1.15); }
      100% { transform: rotate(-22deg) scale(1); }
    }

    /* ── WAY OUT ───────────────────────────────────────────── */
    .exits {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
    }
    .exits a {
      font-size: 18px;
      transition: color 0.15s;
    }
    .exits a:hover { color: var(--pink); }
    .exits .home { text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 860px) {
      .nav { padding: 28px 20px 0; }
      main { padding: 28px 20px 64px; justify-content: flex-start; }
      .staff { height: 150px; }
      .exits a { font-size: 17px; }
      .exits { padding-right: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .whole, .whole.ring { animation: none; }
      .note { animation: fade 2.4s ease forwards; }
      @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
    }
  </style>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>

  <div id="cursor"></div>

  <nav class="nav">
    <a href="/" data-hover>Aditya Borkar</a>
    <a href="/" data-hover>← Home</a>
  </nav>

  <main>
    <p class="eyebrow">Error 404 · page not found</p>

    <h1 class="big" aria-label="404">
      <span aria-hidden="true">4</span>
      <button class="whole" id="whole" type="button" aria-label="Play a chord" data-hover>
        <svg viewBox="0 0 100 70" aria-hidden="true">
          <defs>
            <mask id="hole">
              <rect x="-5" y="-5" width="110" height="80" fill="#fff" />
              <ellipse cx="50" cy="35" rx="17" ry="27" transform="rotate(-48 50 35)" fill="#000" />
            </mask>
          </defs>
          <ellipse cx="50" cy="35" rx="48" ry="33" fill="currentColor" mask="url(#hole)" />
        </svg>
      </button>
      <span aria-hidden="true">4</span>
    </h1>

    <p class="headline"><em>Wrong note.</em> This page doesn't exist, or it moved.</p>

    <div class="play-label">
      <span>While you're here, play something.</span>
      <span id="hint">Tap the staff</span>
    </div>
    <div class="staff" id="staff" tabindex="0" role="application" aria-label="Playable music staff. Tap or click to play a note, or use the keys A to L.">
      <div class="meter" aria-hidden="true"><span>4</span><span>4</span></div>
    </div>

    <nav class="exits" aria-label="Pages">
      <a class="home" href="/" data-hover>Back to the homepage</a>
      <a href="/documentaries.html" data-hover>Documentaries</a>
      <a href="/performances.html" data-hover>Performances</a>
      <a href="/music.html" data-hover>Music</a>
      <a href="/written-works.html" data-hover>Written Works</a>
    </nav>
  </main>

  <script>
    (function () {
      var staff = document.getElementById('staff');
      var whole = document.getElementById('whole');
      var hint  = document.getElementById('hint');

      // Treble staff: five lines, 20px apart. Bottom line is E4.
      var GAP = 20, TOP = 40;                      // top line (F5) sits 40px down
      for (var i = 0; i < 5; i++) {
        var l = document.createElement('div');
        l.className = 'line';
        l.style.top = (TOP + i * GAP) + 'px';
        staff.appendChild(l);
      }
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        hint.textContent = 'Click the staff, or press A to L';
      }

      // Step 0 = E4 (bottom line). Steps go up in half-gaps: D4 is -1, G5 is 9.
      var MIN = -1, MAX = 9;
      var NAMES = ['C','D','E','F','G','A','B'];
      var SEMI  = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
      function freqFor(step) {
        var idx = step + 2;                          // C4 = 0
        var name = NAMES[((idx % 7) + 7) % 7];
        var octave = 4 + Math.floor(idx / 7);
        var midi = 12 * (octave + 1) + SEMI[name];
        return 440 * Math.pow(2, (midi - 69) / 12);
      }
      function yFor(step) { return TOP + 4 * GAP - step * (GAP / 2); }

      // ── A soft, slightly breathy reed tone ─────────────────
      var ctx = null, master = null;
      function audio() {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.5;
          var comp = ctx.createDynamicsCompressor();
          master.connect(comp); comp.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tone(freq, when, len, vol) {
        var c = audio(); if (!c) return;
        var t = c.currentTime + (when || 0);
        len = len || 1.3; vol = vol || 0.28;

        var o1 = c.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq;
        var o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = freq * 1.003;
        var lfo = c.createOscillator(); lfo.frequency.value = 5.2;
        var lfoAmt = c.createGain();
        lfoAmt.gain.setValueAtTime(0, t);
        lfoAmt.gain.linearRampToValueAtTime(freq * 0.006, t + 0.35);
        lfo.connect(lfoAmt); lfoAmt.connect(o1.frequency); lfoAmt.connect(o2.frequency);

        var mix1 = c.createGain(); mix1.gain.value = 0.35;
        var mix2 = c.createGain(); mix2.gain.value = 0.8;
        var filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 3;
        filt.frequency.setValueAtTime(freq * 2, t);
        filt.frequency.linearRampToValueAtTime(freq * 5, t + 0.08);
        filt.frequency.exponentialRampToValueAtTime(freq * 2.2, t + len);

        var env = c.createGain();
        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(vol, t + 0.05);
        env.gain.exponentialRampToValueAtTime(vol * 0.55, t + 0.3);
        env.gain.exponentialRampToValueAtTime(0.0001, t + len);

        o1.connect(mix1); o2.connect(mix2);
        mix1.connect(filt); mix2.connect(filt);
        filt.connect(env); env.connect(master);
        [o1, o2, lfo].forEach(function (o) { o.start(t); o.stop(t + len + 0.05); });
      }

      // ── Notes on the staff ────────────────────────────────
      function drawNote(x, step) {
        var n = document.createElement('div');
        n.className = 'note pop ' + (step >= 4 ? 'down' : 'up');   // stems flip at the middle line
        n.style.left = x + 'px';
        n.style.top  = yFor(step) + 'px';
        n.innerHTML = '<span class="head"></span><span class="stem"></span>';
        staff.appendChild(n);
        setTimeout(function () { n.remove(); }, 3000);
      }
      function play(x, step) {
        step = Math.max(MIN, Math.min(MAX, step));
        drawNote(x, step);
        tone(freqFor(step));
      }

      staff.addEventListener('pointerdown', function (e) {
        var r = staff.getBoundingClientRect();
        var x = e.clientX - r.left, y = e.clientY - r.top;
        var step = Math.round((TOP + 4 * GAP - y) / (GAP / 2));
        play(Math.max(70, x), step);
      });

      // Keys A S D F G H J K L play D4 up to E5; notes march across the staff.
      var keys = 'asdfghjkl', cursorX = 90;
      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
        var k = keys.indexOf(e.key.toLowerCase());
        if (k < 0) return;
        var w = staff.clientWidth;
        cursorX += 46; if (cursorX > w - 30) cursorX = 90;
        play(cursorX, k - 1);
      });

      // The whole note plays a C major 9 chord, gently spread.
      whole.addEventListener('click', function () {
        [261.63, 329.63, 392.0, 493.88, 587.33].forEach(function (f, i) { tone(f, i * 0.06, 2.4, 0.16); });
        whole.classList.remove('ring'); void whole.offsetWidth; whole.classList.add('ring');
      });
    })();
  </script>
  <script src="/site.js" defer></script>
</body>
</html>
